name: Build and Publish Patch Bundle

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build:
    name: Build Piko Patches
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Patches and Generate Bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GPR_KEY || secrets.GITHUB_TOKEN }}
        run: ./gradlew generatePatchesList -Pgpr.user=${{ github.actor }} -Pgpr.key=${{ secrets.GPR_KEY || secrets.GITHUB_TOKEN }}

      - name: Prepare Release Assets & Metadata
        id: prep
        run: |
          mkdir -p release_assets
          MPP_FILE=$(ls patches/build/libs/*.mpp | grep -v "sources" | grep -v "javadoc" | head -n 1)
          cp "$MPP_FILE" release_assets/patches.mpp
          zip -u release_assets/patches.mpp patches-list.json patches-bundle.json
          cp patches-bundle.json release_assets/
          cp patches-list.json release_assets/
          
          PATCH_COUNT=$(jq '. | length' patches-list.json)
          VERSION=$(jq -r '.version' patches-bundle.json)
          echo "patch_count=$PATCH_COUNT" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          IS_PRERELEASE="false"
          if [[ "${{ github.ref_name }}" == "dev" ]]; then
            IS_PRERELEASE="true"
          fi
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: piko-patches-bundle
          path: release_assets/*

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.prep.outputs.version }}
          name: Piko Patches Bundle v${{ steps.prep.outputs.version }} (${{ steps.prep.outputs.patch_count }} Patches)
          body: "Automated patch bundle containing ${{ steps.prep.outputs.patch_count }} Instagram and Twitter patches."
          draft: false
          prerelease: ${{ steps.prep.outputs.is_prerelease == 'true' }}
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
