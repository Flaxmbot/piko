name: Build and Publish Patch Bundle

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build:
    name: Build Piko Patches (127 Patches)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Patches and Generate Bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GPR_KEY || secrets.GITHUB_TOKEN }}
        run: ./gradlew generatePatchesList

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: piko-patches-bundle
          path: |
            patches/build/libs/*.mpp
            patches-bundle.json
            patches-list.json

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-bundle
          name: Piko Patches Bundle (127 Patches)
          body: "Automated patch bundle containing all 127 Instagram and Twitter patches, including the Instagram comment media download crash fix."
          draft: false
          prerelease: false
          files: |
            patches/build/libs/*.mpp
            patches-bundle.json
            patches-list.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
